<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nativia 見積書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700&display=swap">
<style>
/* Layout: 左に選ぶだけの入力パネル、右に印刷できるA4の見積書。スマホでは「入力」「見積書」をタブで切り替える */
:root {
  --bg: #f3f5fb;
  --panel: #ffffff;
  --fg: #141a33;
  --muted: #5d6585;
  --line: #dde2f0;
  --accent: #1f3cf0;
  --accent-soft: #e6eaff;
  --accent-fg: #ffffff;
  --warn: #b5470f;
  --warn-soft: #fdeee4;
  --paper: #ffffff;
  --ink: #111526;
  --ink-muted: #5a607a;
  --rule: #c9cfe2;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-title: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1324; --panel: #171c33; --fg: #e8ebf7; --muted: #9aa2c4; --line: #2a3150;
    --accent: #7d8fff; --accent-soft: #232b55; --accent-fg: #0f1324; --warn: #ffab7a; --warn-soft: #3a2418;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1324; --panel: #171c33; --fg: #e8ebf7; --muted: #9aa2c4; --line: #2a3150;
  --accent: #7d8fff; --accent-soft: #232b55; --accent-fg: #0f1324; --warn: #ffab7a; --warn-soft: #3a2418;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
button, input, select { font: inherit; color: inherit; }
.app { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 470px) minmax(0, 1fr); gap: 24px; align-items: start; }
header.top { max-width: 1400px; margin: 0 auto 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
header.top h1 { font-size: 18px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header.top h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn:focus-visible, .chip:focus-visible, .step button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: none; gap: 6px; max-width: 1400px; margin: 0 auto 12px; }
.tabs button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }

/* 入力パネル */
.form { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.sec h2 { font-size: 13px; margin: 0; color: var(--accent); letter-spacing: .08em; display: flex; gap: 8px; align-items: baseline; }
.sec h2 small { color: var(--muted); font-weight: 400; letter-spacing: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lab { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.lab em { font-style: normal; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; line-height: 1.4; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.chip small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.txt, select.sel, input[type="date"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: max-content; }
.step button { width: 34px; height: 32px; border: 0; background: var(--bg); cursor: pointer; font-size: 16px; }
.stepin { width: 56px; border: 0; background: transparent; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 4px; }
.step output { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
.hint { font-size: 12px; color: var(--muted); }
.hint button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; font-size: 12px; }
.sub { display: flex; flex-wrap: wrap; gap: 10px 18px; padding-left: 10px; border-left: 2px solid var(--accent-soft); }
details.prices { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
details.prices summary { cursor: pointer; font-weight: 700; font-size: 13px; }
.ptable { display: grid; grid-template-columns: 1fr 120px; gap: 6px 10px; margin-top: 10px; align-items: center; font-size: 12px; }
.ptable input { width: 100%; text-align: right; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 6px; font-variant-numeric: tabular-nums; }
.ptable h3 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 12px; color: var(--accent); }

/* 右側 */
.right { position: sticky; top: env(safe-area-inset-top, 0px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
/* 広い画面では見積書のプレビューを入力欄と別にスクロールさせる */
@media (min-width: 961px) { .right { top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; } .right > * { flex-shrink: 0; } }
.internal { background: var(--warn-soft); border: 1px dashed var(--warn); border-radius: 12px; padding: 12px 16px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 24px; }
.internal b { color: var(--warn); }
.internal .t { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.paperwrap { overflow-x: auto; border-radius: 4px; }

/* 見積書(紙なので両テーマで同じ色) */
.paper {
  background: var(--paper); color: var(--ink); width: 794px; min-height: 1123px; margin: 0 auto; padding: 56px 60px;
  box-shadow: 0 1px 2px rgba(17,21,38,.08), 0 12px 32px rgba(17,21,38,.12); font-size: 11.5px; line-height: 1.55;
  font-variant-numeric: tabular-nums;
}
.paper h1 { font-family: var(--font-title); font-size: 28px; letter-spacing: .6em; text-align: center; margin: 0 0 22px; padding-left: .6em; }
.meta { display: flex; justify-content: flex-end; gap: 18px; font-size: 11px; color: var(--ink-muted); margin-bottom: 18px; }
.head { display: grid; grid-template-columns: 1fr 260px; gap: 24px; align-items: start; }
.to { font-size: 15px; border-bottom: 1.5px solid var(--ink); padding-bottom: 4px; font-weight: 700; }
.to small { display: block; font-size: 11.5px; font-weight: 400; }
.lead { margin: 12px 0 14px; }
.totalbox { display: flex; align-items: baseline; justify-content: space-between; border: 1.5px solid var(--ink); padding: 10px 14px; }
.totalbox span { font-size: 12px; }
.totalbox strong { font-size: 22px; letter-spacing: .02em; }
.from { font-size: 11px; line-height: 1.7; }
.from .co { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.logo { display: inline-grid; place-items: center; width: 22px; height: 22px; background: #1f3cf0; color: #fff; font-size: 12px; font-weight: 700; border-radius: 3px; }
.blk { margin-top: 18px; }
.blk h3 { font-size: 11.5px; margin: 0 0 6px; padding: 3px 8px; background: #eef1fb; border-left: 3px solid #1f3cf0; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; padding: 0 8px; }
.kv dt { color: var(--ink-muted); }
.kv dd { margin: 0; }
table.items { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.items th { font-weight: 500; font-size: 10.5px; color: var(--ink-muted); border-bottom: 1px solid var(--ink); padding: 4px 6px; text-align: left; }
table.items td { border-bottom: 1px solid var(--rule); padding: 5px 6px; vertical-align: top; }
table.items .n { text-align: right; white-space: nowrap; }
table.items tr.grp td { background: #f6f7fc; font-weight: 700; border-bottom: 1px solid var(--rule); }
table.items tr.grp td .n { font-weight: 700; }
table.items td.note { color: var(--ink-muted); font-size: 10px; }
.sums { display: grid; grid-template-columns: 1fr 150px; width: 300px; margin: 10px 0 0 auto; gap: 3px 0; }
.sums div:nth-child(odd) { color: var(--ink-muted); }
.sums div:nth-child(even) { text-align: right; }
.sums .g { font-weight: 700; color: var(--ink) !important; border-top: 1.5px solid var(--ink); padding-top: 4px; font-size: 13px; }
.notes { padding: 0 8px; margin: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.notes li::before { content: "・"; }
table.basis td:nth-child(2) { white-space: nowrap; text-align: right; }
table.basis td:nth-child(3) { color: var(--ink); font-size: 10.5px; }
.paper .sub { display: block; text-align: center; font-size: 11px; color: var(--ink-muted); margin: -14px 0 18px; border: 0; padding: 0; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .tabs { display: flex; }
  .right { position: static; }
  .app[data-view="form"] .right { display: none; }
  .app[data-view="paper"] .form { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .chip { transition: background-color .12s, border-color .12s; } }
.share { max-width: 1400px; margin: 0 auto 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.share[hidden] { display: none; }
.share .row { display: flex; gap: 8px; flex-wrap: wrap; }
.share input { flex: 1 1 300px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; font-size: 12px; }
.msg { font-size: 12px; color: var(--muted); }
.vonly { display: none; }
html.viewer .vonly { display: inline-block; }
html.viewer .tonly, html.viewer .tabs, html.viewer .form, html.viewer .internal, html.viewer #flowBox, html.viewer #listBox { display: none !important; }
.ltable { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.ltable th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 4px 6px; white-space: nowrap; }
.ltable td { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; }
.ltable td.n { text-align: right; white-space: nowrap; }
.lwrap { overflow-x: auto; }
html.reviewing .actions, html.reviewing .tabs, html.reviewing .form, html.reviewing .internal { display: none !important; }
html.reviewing .app { grid-template-columns: minmax(0, 1fr); }
html.reviewing .right { position: static; display: flex !important; max-height: none; overflow: visible; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.steps span { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.steps span.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.checks li.warn::before { content: "要確認 "; color: var(--warn); font-weight: 700; }
.checks li.info::before { content: "お知らせ "; color: var(--muted); font-weight: 700; }
html.viewer .app { grid-template-columns: minmax(0, 1fr); }
html.viewer .right { position: static; display: flex !important; max-height: none; overflow: visible; }
@media print {
  .right { max-height: none !important; overflow: visible !important; }
  @page { size: A4; margin: 0; }
  body { background: #fff; padding: 0; }
  header.top, .tabs, .form, .internal { display: none !important; }
  .app { display: block; }
  .right { position: static; display: block !important; }
  .paper { box-shadow: none; margin: 0; width: 210mm; min-height: 297mm; }
  #basis { break-before: page; }
}
</style>
</head>
<body>

<header class="top">
  <h1><span class="tonly" style="margin:0;font-size:inherit;color:inherit;font-weight:inherit">Nativia 見積ツール</span><span class="vonly" style="margin:0;font-size:inherit;color:inherit;font-weight:inherit">株式会社Nativia 御見積書</span><span class="tonly">選ぶだけで見積書ができあがります</span></h1>
  <div class="actions">
    <button class="btn primary tonly" id="reviewBtn" type="button">見積書を確認する</button>
    <button class="btn tonly" id="listBtn" type="button">発行した見積の一覧</button>
    <button class="btn primary vonly" id="pdfBtn" type="button">PDFで保存</button>
    <button class="btn tonly" id="copyBtn" type="button">Markdownでコピー</button>
    <button class="btn tonly" id="mdBtn" type="button">Markdownで保存</button>
    <button class="btn tonly" id="nextNo" type="button">次の見積番号にする</button>
    <button class="btn tonly" id="resetBtn" type="button">入力を最初に戻す</button>
    <button class="btn primary" id="printBtn" type="button" hidden>印刷</button>
  </div>
</header>
<div class="share" id="flowBox" hidden></div>
<div class="share" id="listBox" hidden></div>
<div class="msg" id="pdfMsg" style="max-width:1400px;margin:0 auto 12px" hidden></div>
<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tabForm" aria-selected="true">入力</button>
  <button type="button" role="tab" id="tabPaper" aria-selected="false">見積書と根拠</button>
</div>
<div class="app" id="app" data-view="form">
  <form class="form" id="form" autocomplete="off"></form>
  <div class="right">
    <div class="internal" id="internal"></div>
    <div class="paperwrap"><div class="paper" id="paper"></div></div>
    <div class="paperwrap"><div class="paper" id="basis"></div></div>
  </div>
</div>

  var json = JSON.stringify({ v: 2, n: quoteNo(), i: S.issue, d: d, p: (function () { var o = {}; PRICE_ORDER_2.forEach(function (k, i) { if (P[k] !== PRICE_BASE_2[i]) o[i] = P[k]; }); return o; })(), x: (function () { var o = {}; PRICE_DEFS.forEach(function (g) { g[1].forEach(function (d) { if (PRICE_ORDER_2.indexOf(d[0]) < 0 && P[d[0]] !== d[2]) o[d[0]] = P[d[0]]; }); }); return o; })() });

function applyQuote(data) {

var viewerNo = null;
/* ---------- 確認して発行する ---------- */
var flow = document.getElementById("flowBox");
function checksFor(q) {
  var a = [];

  if (!S.format) a.push(["warn", "形式(アイデアソン、ハッカソン、ビジネスコンテスト)が選ばれていません。"]);

  if (!S.venue) a.push(["warn", "会場が選ばれていません。"]);
  if (!S.mode) a.push(["warn", "開催方法が選ばれていません。"]);
  if (q.feeSum <= 0) a.push(["warn", "代行費が0円です。"]);

  var est = q.cost.filter(function (x) { return !x.fixed; }).length;
  if (est) a.push(["info", "見込みの金額が" + est + "件あります(" + yen(q.estSum) + "、税抜)。"]);
  if (q.tbd.length) a.push(["info", "金額が未定の項目があります(" + q.tbd.join("、") + ")。"]);

function stepsHtml(n) { return '<div class="steps">' + ["1 入力", "2 確認", "3 発行"].map(function (t, i) { return '<span class="' + (i + 1 === n ? "on" : "") + '">' + t + "</span>"; }).join("") + "</div>"; }
function showReview() {

  flow.innerHTML = stepsHtml(2) + '<b style="font-size:14px">見積書の内容を確認してください</b>' +
    (c.length ? '<ul class="checks">' + c.map(function (x) { return '<li class="' + x[0] + '">' + esc(x[1]) + "</li>"; }).join("") + "</ul>" : '<div class="msg">気になる点は見つかりませんでした。</div>') +
    '<div class="msg">合計 ' + yen(q.total) + "(税込)/ 見積番号 " + quoteNo() + (warns ? " / 要確認の項目が" + warns + "件あります。そのまま発行もできます。" : "") + "</div>" +

async function issueQuote() {

  var q = compute();

    (url ? '<div class="row"><input id="shareUrl" readonly aria-label="共有URL" value="' + esc(url) + '"><button class="btn" id="shareCopy" type="button">URLをコピー</button></div><div class="msg">URLの長さ ' + url.length + "文字</div>" : '<div class="msg">このブラウザでは共有URLを作れません。PDFを使ってください。</div>') +
    '<div class="row"><button class="btn" type="button" id="flowRow">スプレッドシート用に1行コピー</button><a class="btn" href="' + SHEET_URL + '" target="_blank" rel="noopener">見積の一覧(スプレッドシート)を開く</a></div><div class="msg">コピーした行を、スプレッドシートの空いている行のA列に貼り付けてください。</div>' +

  document.getElementById("flowRow").onclick = function () { copyText(tsvRow(rec), this, "スプレッドシート用に1行コピー"); };

function backToInput() {

  document.documentElement.classList.remove("reviewing"); view("form"); renderForm(); renderPaper();
}
document.getElementById("reviewBtn").addEventListener("click", showReview);

/* ---------- 発行した見積の一覧 ---------- */
function sheetRow(x) { return [x.no, (x.issuedAt || "").slice(0, 10), x.client || "", x.dept || "", x.format || "", x.eventDate || "", x.total || 0, x.fee || 0, x.url || "", "送付前", ""]; }

  if (!mcp) return { ok: false, why: "この画面ではスプレッドシートに書き込めません" };
  try { await mcp.callTool("Google Sheets", "append_values", { spreadsheetId: SHEET_ID, range: "見積一覧!A1", values: [sheetRow(rec)] }); return { ok: true }; }
  catch (e) {
    var why = { needs_reauth: "Google Sheets のコネクタに再ログインが必要です", server_not_connected: "Google Sheets のコネクタがつながっていません", not_granted: "書き込みが許可されませんでした", consent_required: "書き込みが許可されませんでした", tool_error: "スプレッドシートへの書き込みでエラーが出ました" }[e && e.code] || "スプレッドシートに書き込めませんでした";

/* ---------- PDFで保存 ---------- */
function pdfMsg(t) { var m = document.getElementById("pdfMsg"); m.textContent = t || ""; m.hidden = !t; }
async function buildPdf() {
  var prevView = app.dataset.view; app.dataset.view = "paper";
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  var JsPDF = window.jspdf && window.jspdf.jsPDF;
  if (!JsPDF || !window.html2canvas) throw new Error("lib");
  var pdf = new JsPDF({ unit: "mm", format: "a4", orientation: "portrait" }), first = true;
  var els = [document.getElementById("paper"), document.getElementById("basis")];
  for (var i = 0; i < els.length; i++) {
    var canvas = await window.html2canvas(els[i], { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    var pageH = Math.floor(canvas.width * 297 / 210);
    for (var y = 0; y < canvas.height; y += pageH) {
      var h = Math.min(pageH, canvas.height - y);
      if (h < 40) break;
      var c = document.createElement("canvas"); c.width = canvas.width; c.height = pageH;
      var ctx = c.getContext("2d"); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (!first) pdf.addPage(); first = false;
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 210, 297);
    }
  }
  app.dataset.view = prevView;
  return pdf.output("blob");
}

async function savePdf(b) {

  try {
    var blob = await buildPdf();

    if (dl) {
      try { await dl.save({ filename: name, data: blob }); pdfMsg("PDFを保存しました。"); }
      catch (e) { pdfMsg(e && e.code === "declined" ? "保存を取りやめました。" : "この画面ではPDFを保存できませんでした。"); }

/* ---------- 起動 ---------- */
/* 共有リンクの見積データ(q.…)を、URLの # のあと、? のあと、親ページの順に探す */
function findToken() {
  var cands = [location.hash, location.search, document.referrer];
  try { if (window.parent !== window) cands.push(window.parent.location.href); } catch (e) {}
  for (var i = 0; i < cands.length; i++) { var m = /[#?&]q[.=]([A-Za-z0-9_-]{10,})/.exec(cands[i] || ""); if (m) return m[1]; }
  return "";
}
async function showQuoteFromLink() {

  app.dataset.view = "paper";
  document.getElementById("basis").parentNode.hidden = false;
  document.getElementById("pdfBtn").hidden = false;
  renderPaper();
  return true;
}
window.addEventListener("hashchange", function () { showQuoteFromLink(); });
(async function boot() {

    try {
      var data = await decodeQuote(h.slice(2));

      document.documentElement.classList.add("viewer");
      app.dataset.view = "paper";
      renderPaper();
      return;
    } catch (e) {}
  }
  if (VIEWER_ONLY) {
    document.documentElement.classList.add("viewer");
    document.getElementById("paper").innerHTML = '<p style="padding:40px 40px 8px;text-align:center">見積書のリンクが正しくありません。送られてきたリンクをもう一度開いてください。</p>' +
      '<p style="padding:0 40px 40px;font-size:11px;color:#777;word-break:break-all">確認用 ページのURL ' + esc(location.href.slice(0, 160)) + ' / 開いた元 ' + esc((document.referrer || "なし").slice(0, 160)) + '</p>';
    document.getElementById("basis").parentNode.hidden = true;
    document.getElementById("pdfBtn").hidden = true;
    return;
  }
  renderForm();
  renderPaper();
})();
})();
